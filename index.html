<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Reserve Collection</title>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { 
      background-color: #070505; 
      color: #e0e0e0; 
      padding-bottom: 2rem; 
      min-height: 100vh; 
      position: relative;
      overflow-x: hidden;
    }
    
    #bgCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
    }

    #catalogPage { position: relative; z-index: 1; }

    .hero { 
      text-align: center; 
      padding: 4rem 1rem 3rem; 
      background: radial-gradient(circle at 50% -20%, #3a1c1c 0%, #120909 60%, #070505 100%);
      border-bottom: 1px solid rgba(216, 178, 85, 0.15); 
      position: relative;
    }

    .hero h1 { 
      color: #d8b255; 
      font-size: 2.4rem; 
      font-family: 'Georgia', serif; 
      text-shadow: 0 0 20px rgba(216, 178, 85, 0.3), 0 2px 10px rgba(0,0,0,0.8); 
      letter-spacing: 1px;
    }
    .hero p { color: #c0b0b0; font-size: 0.95rem; margin-top: 0.5rem; text-shadow: 0 1px 5px rgba(0,0,0,0.8); }

    .controls { display: flex; justify-content: center; gap: 0.8rem; margin: 1.8rem 1rem; flex-wrap: wrap; }
    input, select { 
      padding: 0.65rem 1.2rem; 
      border-radius: 20px; 
      border: 1px solid rgba(216, 178, 85, 0.25); 
      background: rgba(18, 11, 11, 0.75); 
      backdrop-filter: blur(10px); 
      color: #fff; 
      font-size: 0.85rem; 
      outline: none; 
      transition: all 0.3s;
    }
    input:focus, select:focus { border-color: #d8b255; box-shadow: 0 0 12px rgba(216, 178, 85, 0.3); }
    .search-input { width: 280px; }

    .wine-grid { 
      display: grid; 
      grid-template-columns: repeat(5, 1fr); 
      gap: 1.1rem; 
      max-width: 1400px; 
      margin: 0 auto; 
      padding: 0 1rem; 
      perspective: 1000px;
    }

    @media (max-width: 1200px) { .wine-grid { grid-template-columns: repeat(4, 1fr); } }
    @media (max-width: 900px) { .wine-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 600px) { .wine-grid { grid-template-columns: repeat(2, 1fr); gap: 0.75rem; } }
    @media (max-width: 400px) { .wine-grid { grid-template-columns: 1fr; } }

    .wine-card { 
      background: rgba(18, 12, 12, 0.85); 
      border: 1px solid rgba(255, 255, 255, 0.08); 
      border-radius: 14px; 
      overflow: hidden; 
      display: flex; 
      flex-direction: column; 
      cursor: pointer; 
      transition: transform 0.2s ease-out, border-color 0.3s, box-shadow 0.3s; 
      backdrop-filter: blur(8px);
      position: relative;
      transform-style: preserve-3d;
    }

    .wine-card::before {
      content: '';
      position: absolute;
      top: -100%;
      left: -100%;
      width: 300%;
      height: 300%;
      background: linear-gradient(45deg, transparent 45%, rgba(216, 178, 85, 0.12) 50%, transparent 55%);
      transition: transform 0.8s ease;
      pointer-events: none;
      z-index: 5;
    }
    .wine-card:hover::before { transform: translate(50%, 50%); }

    .wine-card:hover { 
      border-color: #d8b255; 
      box-shadow: 0 12px 30px rgba(216, 178, 85, 0.25), 0 0 15px rgba(0, 0, 0, 0.8); 
    }
    
    .img-wrapper { position: relative; width: 100%; height: 175px; background: radial-gradient(circle at center, #1a0d0d 0%, #050303 100%); }
    .wine-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
    .wine-card:hover .wine-img { transform: scale(1.05); }

    .vintage-badge { 
      position: absolute; 
      top: 10px; 
      right: 10px; 
      background: linear-gradient(135deg, #d8b255 0%, #aa8330 100%); 
      color: #0b0808; 
      font-weight: 800; 
      font-size: 0.7rem; 
      padding: 2px 8px; 
      border-radius: 10px; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
      z-index: 2;
    }

    .card-content { padding: 0.95rem; display: flex; flex-direction: column; flex-grow: 1; z-index: 2; }
    .card-title { font-size: 0.95rem; color: #fff; font-weight: 700; margin-bottom: 0.3rem; font-family: 'Georgia', serif; line-height: 1.25; }
    .region { color: #887575; font-size: 0.75rem; margin-bottom: 0.6rem; }

    .details { font-size: 0.75rem; color: #ccc; margin-bottom: 1rem; flex-grow: 1; line-height: 1.35; }
    .detail-row { margin-bottom: 0.3rem; }
    .detail-row strong { color: #d8b255; }

    .btn-order { 
      width: 100%; 
      padding: 0.65rem; 
      border-radius: 8px; 
      border: 1px solid #d8b255; 
      background: rgba(216, 178, 85, 0.05); 
      color: #d8b255; 
      font-weight: 700; 
      font-size: 0.8rem; 
      cursor: pointer; 
      transition: all 0.25s ease; 
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }
    .btn-order:hover { background: #d8b255; color: #0b0808; box-shadow: 0 4px 15px rgba(216, 178, 85, 0.4); }

    footer {
      text-align: center;
      padding: 2.5rem 1rem 1rem;
      margin-top: 4rem;
      border-top: 1px solid rgba(216, 178, 85, 0.15);
      color: #776666;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
    }
    footer strong { color: #d8b255; font-weight: 600; }

    .fullpage-detail { 
      display: none; 
      position: fixed; 
      inset: 0; 
      background: rgba(7, 5, 5, 0.96); 
      z-index: 9999; 
      overflow-y: auto; 
      padding: 2.5rem 1rem;
      backdrop-filter: blur(12px);
    }
    .fullpage-detail.active { display: block; animation: fadeIn 0.3s ease; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .detail-container { 
      max-width: 950px; 
      margin: 0 auto; 
      background: linear-gradient(145deg, #180e0e 0%, #0d0808 100%); 
      border: 1px solid rgba(216, 178, 85, 0.25); 
      border-radius: 20px; 
      padding: 2.5rem; 
      position: relative; 
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.95), 0 0 50px rgba(216, 178, 85, 0.08);
    }
    .btn-back { 
      display: inline-flex; 
      align-items: center; 
      gap: 0.5rem; 
      background: rgba(31, 19, 19, 0.8); 
      border: 1px solid rgba(216, 178, 85, 0.3); 
      color: #d8b255; 
      padding: 0.6rem 1.2rem; 
      border-radius: 25px; 
      cursor: pointer; 
      font-weight: 600; 
      font-size: 0.85rem;
      margin-bottom: 2rem; 
      transition: all 0.25s;
    }
    .btn-back:hover { background: #d8b255; color: #0b0808; transform: translateX(-3px); }

    .detail-layout { display: grid; grid-template-columns: 0.9fr 1.1fr; gap: 2.5rem; align-items: start; }
    @media (max-width: 768px) { 
      .detail-layout { grid-template-columns: 1fr; gap: 1.8rem; } 
      .detail-container { padding: 1.5rem; }
    }

    .detail-img-box { 
      width: 100%; 
      height: 440px; 
      border-radius: 16px; 
      overflow: hidden; 
      background: radial-gradient(circle at center, #2e1a1b 0%, #080505 100%); 
      position: relative; 
      border: 1px solid rgba(216, 178, 85, 0.25);
      box-shadow: inset 0 0 50px rgba(0,0,0,0.8), 0 10px 30px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .detail-img-box img { 
      max-width: 90%; 
      max-height: 88%; 
      object-fit: contain; 
      filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.8));
      animation: floatBottle 4s ease-in-out infinite alternate;
    }

    @keyframes floatBottle {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-10px) scale(1.02); }
    }

    .detail-info { display: flex; flex-direction: column; }
    .detail-title { 
      font-size: 2rem; 
      color: #fff; 
      font-family: 'Georgia', serif; 
      font-weight: 700; 
      margin-bottom: 0.6rem; 
      line-height: 1.25;
      letter-spacing: 0.5px;
    }

    .badge-group { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .pill-badge { 
      display: inline-flex; 
      align-items: center; 
      gap: 0.4rem; 
      padding: 5px 12px; 
      background: rgba(216, 178, 85, 0.1); 
      border: 1px solid rgba(216, 178, 85, 0.3); 
      border-radius: 20px; 
      font-size: 0.8rem; 
      color: #d8b255; 
      font-weight: 600;
    }

    .info-section { 
      background: rgba(255, 255, 255, 0.02); 
      border: 1px solid rgba(255, 255, 255, 0.06); 
      border-radius: 12px; 
      padding: 1.2rem; 
      margin-top: 1rem; 
    }
    .info-section h3 { 
      color: #d8b255; 
      font-size: 0.95rem; 
      text-transform: uppercase; 
      letter-spacing: 1px; 
      margin-bottom: 0.9rem; 
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .flavor-item { 
      display: flex; 
      gap: 0.8rem; 
      margin-bottom: 0.8rem; 
      font-size: 0.88rem; 
      line-height: 1.4;
    }
    .flavor-item:last-child { margin-bottom: 0; }
    .flavor-label { color: #887575; min-width: 120px; font-weight: 600; }
    .flavor-value { color: #e0e0e0; flex: 1; }

    .extra-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; margin-top: 0.3rem; }
    .extra-card { 
      background: linear-gradient(135deg, rgba(30, 18, 18, 0.7) 0%, rgba(15, 10, 10, 0.8) 100%); 
      border: 1px solid #2e1a1a; 
      padding: 0.9rem 1rem; 
      border-radius: 10px; 
      transition: border-color 0.2s;
    }
    .extra-card:hover { border-color: rgba(216, 178, 85, 0.4); }
    .extra-card span { display: block; font-size: 0.75rem; color: #887575; margin-bottom: 0.3rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .extra-card strong { font-size: 0.95rem; color: #fff; font-weight: 700; }

    .btn-order-cta { 
      width: 100%; 
      padding: 1rem; 
      border-radius: 10px; 
      border: none; 
      background: linear-gradient(135deg, #d8b255 0%, #b89235 100%); 
      color: #0b0808; 
      font-weight: 800; 
      font-size: 1rem; 
      cursor: pointer; 
      transition: all 0.3s ease; 
      box-shadow: 0 6px 20px rgba(216, 178, 85, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
    }
    .btn-order-cta:hover { 
      background: linear-gradient(135deg, #e5c065 0%, #c9a042 100%); 
      transform: translateY(-2px); 
      box-shadow: 0 10px 25px rgba(216, 178, 85, 0.4); 
    }
  </style>
</head>
<body>

  <canvas id="bgCanvas"></canvas>

  <div id="catalogPage">
    <div class="hero">
      <h1 id="heroTitle">🍷 Private Reserve Collection</h1>
      <p id="heroSubtitle">Explore our curated collection of fine wines and premium spirits.</p>
    </div>

    <div class="controls">
      <input type="text" id="searchInput" class="search-input" placeholder="Search beverage name or region..." oninput="renderWines()">
      <select id="typeFilter" onchange="renderWines()">
        <option value="All">All Types</option>
        <optgroup label="Wines">
            <option value="Red Wine">Red Wine</option>
            <option value="White Wine">White Wine</option>
            <option value="Rosé Wine">Rosé Wine</option>
            <option value="Sparkling Wine">Sparkling Wine</option>
        </optgroup>
        <optgroup label="Spirits & Liqueurs">
            <option value="Whisky / Whiskey">Whisky / Whiskey</option>
            <option value="Vodka">Vodka</option>
            <option value="Rum">Rum</option>
            <option value="Gin">Gin</option>
            <option value="Tequila / Mezcal">Tequila / Mezcal</option>
            <option value="Brandy / Cognac">Brandy / Cognac</option>
            <option value="Liqueur">Liqueur</option>
        </optgroup>
      </select>
    </div>

    <div class="wine-grid" id="wineGrid"></div>

    <footer>
      <p>&copy; 2026 Copyright by <strong>Mitra Buana Intimas</strong>. All Rights Reserved.</p>
    </footer>
  </div>

  <div id="detailView" class="fullpage-detail">
    <div class="detail-container">
      <button class="btn-back" onclick="closeDetail()">← Kembali ke Katalog</button>
      <div class="detail-layout" id="detailContent"></div>
    </div>
  </div>

  <script>
    /* KONFIGURASI SUPABASE */
    const SUPABASE_URL = "https://gzozsdbtcmmwzogzyeyn.supabase.co";
    /* PASTE ANON KEY SUPABASE MILIKMU (panjang, diawali eyJhbGci...) DI BAWAH INI: */
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd6b3pzZGJ0Y21td3pvZ3p5ZXluIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4ODUxMzE5OSwiZXhwIjoyMTA0MDg5MTk5fQ._cPAvNB04sAP0DvcSfn-DbKubcgGlGlznG8owCIk1X8";
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    /* Background Canvas Engine */
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;
    let mouse = { x: width / 2, y: height / 2, active: false };

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      mouse.active = true;
    });

    const particles = Array.from({ length: 60 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      radius: Math.random() * 2.5 + 0.5,
      alpha: Math.random() * 0.5 + 0.1,
      vx: (Math.random() - 0.5) * 0.4,
      vy: -(Math.random() * 0.4 + 0.2),
    }));

    function drawInteractiveBG() {
      ctx.clearRect(0, 0, width, height);
      if (mouse.active) {
        const glowRadius = 380;
        const gradient = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, glowRadius);
        gradient.addColorStop(0, 'rgba(216, 178, 85, 0.08)');
        gradient.addColorStop(0.5, 'rgba(120, 30, 30, 0.04)');
        gradient.addColorStop(1, 'transparent');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);
      }
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        if (mouse.active) {
          const dx = mouse.x - p.x;
          const dy = mouse.y - p.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 120) {
            const angle = Math.atan2(dy, dx);
            p.x -= Math.cos(angle) * 1.5;
            p.y -= Math.sin(angle) * 1.5;
          }
        }
        if (p.y < -10) { p.y = height + 10; p.x = Math.random() * width; }
        if (p.x < -10) p.x = width + 10;
        if (p.x > width + 10) p.x = -10;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(216, 178, 85, ${p.alpha})`;
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#d8b255';
        ctx.fill();
      });
      requestAnimationFrame(drawInteractiveBG);
    }
    drawInteractiveBG();

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    let localWines = [];
    let currentFilteredWines = [];
    const spiritTypes = ["Whisky / Whiskey", "Vodka", "Rum", "Gin", "Tequila / Mezcal", "Brandy / Cognac", "Liqueur"];

    async function fetchWinesFromSupabase() {
      try {
        const { data, error } = await supabaseClient.from('wines').select('*');
        
        if (error) {
          console.error('Error fetching Supabase data:', error);
          alert('Gagal memuat katalog: ' + error.message);
          return;
        }

        if (data) {
          // Mapping otomatis untuk mendukung format camelCase maupun snake_case di database
          localWines = data.map(w => ({
            ...w,
            imageUrl: w.imageUrl || w.image_url || '',
            servingTemp: w.servingTemp || w.serving_temp || '',
            stockStatus: w.stockStatus || w.stock_status || '',
            storageNote: w.storageNote || w.storage_note || ''
          }));
          renderWines();
        }
      } catch (err) { 
        console.error('Error fetching Supabase data:', err); 
      }
    }

    function renderWines() {
      const grid = document.getElementById('wineGrid');
      const search = document.getElementById('searchInput').value.toLowerCase();
      const filter = document.getElementById('typeFilter').value;

      currentFilteredWines = localWines.filter(wine => {
        const matchesSearch = (wine.name && wine.name.toLowerCase().includes(search)) || 
                              (wine.region && wine.region.toLowerCase().includes(search));
        const matchesType = filter === 'All' || wine.type === filter;
        return matchesSearch && matchesType;
      });

      if (currentFilteredWines.length === 0) {
        grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color: #888; padding: 3rem 0;">Belum ada data minuman yang sesuai.</p>';
        return;
      }

      grid.innerHTML = currentFilteredWines.map((wine, idx) => {
        const isSpirit = spiritTypes.includes(wine.type);
        return `
          <div class="wine-card" onclick="openDetail(${idx})" onmousemove="handleTilt(event, this)" onmouseleave="resetTilt(this)">
            <div class="img-wrapper">
              <img src="${wine.imageUrl || 'https://via.placeholder.com/300x190?text=No+Image'}" class="wine-img" onerror="this.src='https://via.placeholder.com/300x190?text=No+Image'">
              <span class="vintage-badge">${escapeHtml(wine.vintage) || '-'}</span>
            </div>
            <div class="card-content">
              <div class="card-title">${escapeHtml(wine.name)}</div>
              <div class="region">📍 ${escapeHtml(wine.region)} • ${escapeHtml(wine.type)}</div>
              <div class="details">
                <div class="detail-row"><strong>${isSpirit ? 'Base Grain' : 'Varietal'}:</strong> ${escapeHtml(wine.varietal) || '-'}</div>
                <div class="detail-row"><strong>Notes:</strong> ${escapeHtml(wine.notes) || '-'}</div>
                <div class="detail-row"><strong>${isSpirit ? 'Serving' : 'Pairing'}:</strong> ${escapeHtml(wine.pairing) || '-'}</div>
              </div>
              <button class="btn-order" onclick="event.stopPropagation(); inquireWineByIdx(${idx})">
                💬 Order / Inquire
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function handleTilt(e, card) {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left - rect.width / 2;
      const y = e.clientY - rect.top - rect.height / 2;
      card.style.transform = `perspective(1000px) rotateX(${(-y / rect.height) * 10}deg) rotateY(${(x / rect.width) * 10}deg) translateY(-5px)`;
    }

    function resetTilt(card) {
      card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0px)`;
    }

    function openDetail(index) {
      const wine = currentFilteredWines[index];
      if (!wine) return;
      const isSpirit = spiritTypes.includes(wine.type);

      document.getElementById('detailContent').innerHTML = `
        <div class="detail-img-box">
          <img src="${wine.imageUrl || 'https://via.placeholder.com/500x380?text=No+Image'}" onerror="this.src='https://via.placeholder.com/500x380?text=No+Image'">
          <span class="vintage-badge" style="font-size: 0.85rem; padding: 5px 12px; top: 15px; right: 15px;">${escapeHtml(wine.vintage) || '-'}</span>
        </div>
        <div class="detail-info">
          <div class="detail-title">${escapeHtml(wine.name)}</div>
          <div class="badge-group">
            <span class="pill-badge">📍 ${escapeHtml(wine.region) || 'Origin Unknown'}</span>
            <span class="pill-badge">🍷 ${escapeHtml(wine.type) || 'Beverage'}</span>
          </div>
          <div class="info-section">
            <h3>✨ Karakteristik & Profil Rasa</h3>
            <div class="flavor-item"><div class="flavor-label">${isSpirit ? '🍇 Base Ingredient' : '🍇 Varietal / Grape'}</div><div class="flavor-value">${escapeHtml(wine.varietal) || '-'}</div></div>
            <div class="flavor-item"><div class="flavor-label">📝 Tasting Notes</div><div class="flavor-value">${escapeHtml(wine.notes) || '-'}</div></div>
            <div class="flavor-item"><div class="flavor-label">${isSpirit ? '🍹 Serving Style' : '🥩 Food Pairing'}</div><div class="flavor-value">${escapeHtml(wine.pairing) || '-'}</div></div>
          </div>
          <div class="info-section">
            <h3>⚙️ Informasi Tambahan</h3>
            <div class="extra-grid">
              <div class="extra-card"><span>Alcohol (ABV)</span><strong>${escapeHtml(wine.abv) || '-'}</strong></div>
              <div class="extra-card"><span>${isSpirit ? 'Serving Style' : 'Suhu Penyajian'}</span><strong>${escapeHtml(wine.servingTemp) || '-'}</strong></div>
              <div class="extra-card"><span>Status Stok</span><strong>${escapeHtml(wine.stockStatus) || 'Tersedia'}</strong></div>
              <div class="extra-card"><span>${isSpirit ? 'Cask / Barrel Type' : 'Storage Note'}</span><strong>${escapeHtml(wine.storageNote) || '-'}</strong></div>
            </div>
          </div>
          <div style="margin-top: 1.8rem;">
            <button class="btn-order-cta" onclick="inquireWineByIdx(${index})">💬 Pesan / Konsultasi via WhatsApp</button>
          </div>
        </div>
      `;
      document.getElementById('detailView').classList.add('active');
      window.scrollTo(0, 0);
    }

    function closeDetail() { document.getElementById('detailView').classList.remove('active'); }

    function inquireWineByIdx(index) {
      const wine = currentFilteredWines[index];
      if (!wine) return;
      const message = `Halo, saya tertarik dengan minuman: ${wine.name} (${wine.vintage || '-'}). Boleh minta info pemesanan?`;
      window.open(`https://wa.me/6281234567890?text=${encodeURIComponent(message)}`, '_blank');
    }

    fetchWinesFromSupabase();
  </script>
</body>
